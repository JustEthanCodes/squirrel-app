name: Build Linux executables

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            architecture: x86_64
          - os: ubuntu-24.04-arm
            architecture: aarch64
    runs-on: ${{ matrix.os }}
    name: Linux ${{ matrix.architecture }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libxdo-dev libappindicator3-dev

      - name: Build release executables
        run: cargo build --release --verbose

      - name: Upload release executables
        uses: actions/upload-artifact@v4
        with:
          name: bradley-linux-${{ matrix.architecture }}
          path: |
            target/release/bradley
            target/release/please
          if-no-files-found: error
