name: Build Windows Executable

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Build release executable
        run: cargo build --release --verbose

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: bradley-windows-exe
          path: target/release/bradley.exe
          if-no-files-found: error

  build-windows-arm64:
    runs-on: windows-11-arm
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Windows ARM64 Rust target
        run: rustup target add aarch64-pc-windows-msvc

      - name: Build ARM64 release executable
        run: cargo build --release --target aarch64-pc-windows-msvc --verbose

      - name: Upload ARM64 executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: bradley-windows-arm64-exe
          path: target/aarch64-pc-windows-msvc/release/bradley.exe
          if-no-files-found: error
